<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Jupiter — Native Android media player powered by libmpv</title>
  <desc id="desc">Hero banner showing the three-color Jupiter Band Play mark, plain-language summary, supported runtime specs, and a preview of the translucent Compose player HUD.</desc>

  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="1200" height="380" rx="24"/>
    </clipPath>
    <radialGradient id="ambient-glow" cx="78%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#E49B4B" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#C84B31" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090C12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="1200" height="380" fill="#090C12"/>
    <rect width="1200" height="380" fill="url(#ambient-glow)"/>
    <rect x="0" y="0" width="400" height="5" fill="#E8D2B5"/>
    <rect x="400" y="0" width="400" height="5" fill="#E49B4B"/>
    <rect x="800" y="0" width="400" height="5" fill="#C84B31"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <g id="title-block" transform="translate(56 48)">
    <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="#E49B4B" letter-spacing="1.2">ANDROID · LIBMPV · BETA 0.1.0</text>

    <g transform="translate(0 46)">
      <rect x="0" y="0" width="84" height="84" rx="20" fill="#141923" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
      <g transform="translate(9 9) scale(0.2578)">
        <path fill="#E8D2B5" d="M 50 86 V 46 Q 50 32 62.12 39 L 143.53 86 Z"/>
        <path fill="#E49B4B" d="M 50 98 H 164.32 L 204.16 121 Q 216.28 128 204.16 135 L 164.32 158 H 50 Z"/>
        <path fill="#C84B31" d="M 50 170 H 143.53 L 62.12 217 Q 50 224 50 210 Z"/>
      </g>
      <text x="106" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="700" fill="#F2F5FA" letter-spacing="-1">Jupiter</text>
    </g>

    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#D5DCE6">Native Android media player powered by libmpv (C/JNI)</text>
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#D5DCE6">with a translucent Jetpack Compose UI for phones and tablets.</text>

    <text x="0" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA4B2">minSdk 29+ · mpv 0.42.0 · FFmpeg 9.0.2 · 3 ABIs</text>
  </g>

  <g id="player-preview" transform="translate(716 44)">
    <rect x="0" y="0" width="428" height="292" rx="18" fill="#141923" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

    <g transform="translate(20 20)">
      <rect x="0" y="0" width="160" height="34" rx="10" fill="#1E2636" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="80" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#E8D2B5">HW+ MediaCodec</text>

      <rect x="172" y="0" width="120" height="34" rx="10" fill="#1E2636" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="232" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#E49B4B">ASS · SRT</text>

      <rect x="304" y="0" width="84" height="34" rx="10" fill="#1E2636" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="346" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="#F2F5FA">PiP</text>
    </g>

    <g transform="translate(174 82) scale(0.3125)">
      <path fill="#E8D2B5" d="M 50 86 V 46 Q 50 32 62.12 39 L 143.53 86 Z"/>
      <path fill="#E49B4B" d="M 50 98 H 164.32 L 204.16 121 Q 216.28 128 204.16 135 L 164.32 158 H 50 Z"/>
      <path fill="#C84B31" d="M 50 170 H 143.53 L 62.12 217 Q 50 224 50 210 Z"/>
    </g>

    <g transform="translate(24 186)">
      <rect x="0" y="0" width="380" height="8" rx="4" fill="#252F42"/>
      <rect x="0" y="0" width="236" height="8" rx="4" fill="#E49B4B"/>
      <circle cx="110" cy="4" r="3" fill="#E8D2B5"/>
      <circle cx="290" cy="4" r="3" fill="#9AA4B2"/>
      <circle cx="236" cy="4" r="8" fill="#F2F5FA"/>
      <text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA4B2">00:42:18</text>
      <text x="380" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9AA4B2">01:08:00</text>
    </g>

    <g transform="translate(20 236)">
      <rect x="0" y="0" width="388" height="36" rx="10" fill="#0F131C" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="194" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E8D2B5">Compose → MpvEngine → libmpv</text>
    </g>
  </g>
</svg>
